<!DOCTYPE html>
<html>
<!-- Missing lang attribute (WCAG 3.1.1) -->
<head>
  <title>Accessibility Test Page</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    /* Low contrast text (WCAG 1.4.3) */
    .low-contrast { color: #ccc; background: #fff; font-size: 16px; }
    .form-group { margin: 16px 0; }
    .hidden-label { display: none; }
    .btn { padding: 8px 16px; cursor: pointer; }
    .fake-btn { display: inline-block; padding: 8px 16px; background: #3498db; color: #fff; cursor: pointer; }
    table { border-collapse: collapse; margin: 16px 0; }
    td, th { border: 1px solid #ccc; padding: 8px; }
    .marquee { animation: scroll 5s linear infinite; }
  </style>
</head>
<body>

<h1>Accessibility Violations Demo</h1>

<!-- Image without alt text (WCAG 1.1.1) -->
<img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" width="200" height="100">

<!-- Low contrast text -->
<p class="low-contrast">This text has very low contrast and is hard to read.</p>

<!-- Form without labels (WCAG 1.3.1, 4.1.2) -->
<form>
  <div class="form-group">
    <input type="text" placeholder="Enter your name">
  </div>
  <div class="form-group">
    <input type="email" placeholder="Enter your email">
  </div>
  <div class="form-group">
    <select>
      <option value="">Choose an option</option>
      <option value="1">Option 1</option>
      <option value="2">Option 2</option>
    </select>
  </div>
  <!-- Button without accessible name -->
  <button class="btn" type="submit"></button>
</form>

<!-- Link without discernible text (WCAG 2.4.4) -->
<a href="https://example.com"><img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" width="20" height="20"></a>

<!-- Empty heading (WCAG 1.3.1) -->
<h2></h2>

<!-- Clickable div instead of button (WCAG 4.1.2) -->
<div class="fake-btn" onclick="alert('clicked')">Click me</div>

<!-- Table without headers (WCAG 1.3.1) -->
<table>
  <tr><td>Name</td><td>Age</td><td>City</td></tr>
  <tr><td>Alice</td><td>30</td><td>London</td></tr>
  <tr><td>Bob</td><td>25</td><td>Paris</td></tr>
</table>

<!-- Duplicate ID (WCAG 4.1.1) -->
<div id="duplicate-id">First element</div>
<div id="duplicate-id">Second element</div>

<!-- Auto-playing content / moving text (WCAG 2.2.2) -->
<marquee>This scrolling text is an accessibility issue</marquee>

</body>
</html>
